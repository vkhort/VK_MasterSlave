[platformio]
; Ищем исходники в корневой папке проекта
src_dir = .

[env:esp32-dev-center]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Подключаем кастомную разметку памяти под OTA и LittleFS
board_build.partitions = partitions.csv

; ✅ ДОБАВЛЯЕМ ЭТИ СТРОКИ ДЛЯ БЕСПРОВОДНОЙ ПРОШИВКИ ПО ВОЗДУХУ:
;upload_protocol = espota
;upload_port = 192.168.4.1   ; Системный IP-адрес точки доступа нашего Центра